name: Setup (Node + npm ci)
description: >-
  Repo setup preamble factored out of the workflows (issue #27): installs the
  pinned Node version with npm cache and runs `npm ci`. The `node-version` input
  default below is the ONLY Node literal in CI — every job goes through this
  composite, so a CI-side bump is a single edit. External actions inside this
  composite stay SHA-pinned, and this is also the single `actions/setup-node`
  pin site in the repo (#327): no workflow may pin `setup-node` directly.

  The one remaining duplicate of the Node literal is `mise.toml` (the LOCAL
  toolchain, which CI cannot read). That couple is not merely asserted — it is
  ENFORCED by `.github/scripts/check-node-pin-drift.sh`, a fail-closed CI gate
  that reds on divergence and on any reintroduced raw `node-version:` literal
  (#329). When you bump the default here, bump `mise.toml` in the same commit.

  NOTE: this composite does NOT check out the repo. A local composite action
  cannot be resolved until `actions/checkout` has already placed it on the
  runner, so every calling job must run `actions/checkout`
  (`persist-credentials: false`, with its own `fetch-depth`) BEFORE
  `uses: ./.github/actions/setup`.

inputs:
  node-version:
    description: Node.js version to install (single source of truth for the pin).
    required: false
    default: '24.19.0'
  npm-ci:
    description: >-
      Whether to run `npm ci`. Set to 'false' for jobs that need Node but not
      the installed dependency tree (e.g. the threat-model JSON check).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    - if: inputs.npm-ci == 'true'
      shell: bash
      run: npm ci
