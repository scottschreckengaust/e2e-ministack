id = "CVE-2026-14257"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: `brace-expansion.expand()` bounds the NUMBER of results via its `max` option (default 100,000) but does not bound the LENGTH of each result string. By chaining brace groups an attacker keeps the count under the limit while making each result progressively longer, so memory scales with count times length until the process hits a fatal, uncatchable out-of-memory error — roughly 7.5 KB of input (`'{a,b}'.repeat(1500)`) is enough to crash a default Node process. Upstream scopes the precondition precisely: it affects any application that passes ATTACKER-INFLUENCED STRINGS to `expand()`, directly or transitively via minimatch/glob brace patterns. No such path exists in this deployment. brace-expansion is only ever reached through a glob/minimatch pattern argument, and the only brace patterns in play are literals inside the emulator's own packaged JavaScript plus the fixed, hard-coded resource names this repository's tests address (`cdk-demo-bucket`, `cdk-demo-log-bucket`, `cdk-doubler`). None of the MiniStack API operations this repo exercises — S3 PutObject/GetObject, Lambda Invoke, CloudFormation create/update during `cdk deploy` — forwards caller-supplied text into a shell-glob brace expansion, and no external caller can reach the loopback-bound port 4566 to attempt it. The blast radius is additionally bounded by design: an OOM in this throwaway, per-run container would fail a CI build, not degrade any persistent or user-facing service. Scope note: this record is DISTINCT from `.vex/CVE-2026-13149.openvex.json` (a different CVE against the same Debian `node-brace-expansion` package in this image) and from `.vex/npm-brace-expansion-CVE-2026-13149.openvex.json` (a different CVE against the `pkg:npm/brace-expansion` copy bundled inside aws-cdk-lib, an `affected` acceptance on the npm-audit surface). DISCLOSED CROSS-SURFACE EFFECT, measured rather than assumed: the reachability argument above is made ONLY for the Debian `node-brace-expansion` instance inside the pinned image, but this record does not suppress only that instance. Two gate surfaces match `.vex/` records by IDENTIFIER ALONE, never comparing purls, so an image-scoped record reaches the repo tree as well. (1) The Grype FILESYSTEM gate (`.github/scripts/grype-fs-gate.ts`, #284) unions every record's `vulnerability.name` and `aliases[]` into one accepted-id set; adding this record was measured to shrink that gate's uncovered set from 19 findings to 18, the removed entry being CVE-2026-14257 reported as GHSA-mh99-v99m-4gvg against the repo-tree `pkg:npm/brace-expansion@5.0.6` copy bundled inside aws-cdk-lib. (2) The generated OSV dialect (`osv-scanner.toml`, `[[IgnoredVulns]]`) emits this id from this record, and OSV-Scanner was observed filtering `CVE-2026-14257 and 1 alias` from four `pkg:npm/brace-expansion` lockfile entries. Both effects concern the SAME upstream defect in a SECOND, separately-installed instance whose reachability this record does NOT argue: the npm copy is consumed by this repository's own CDK/glob toolchain, not by the emulator. By contrast the Trivy filesystem scan matches on the full purl and therefore still reports the npm instance — proof that this widening is an artifact of the id-only matchers, not of the finding being resolved. The npm instance is accordingly only legitimately settled by its own explicit acceptance on the npm surface or by an `aws-cdk-lib` bump that ships a patched bundled copy (the route the #322 sweep's CDK-toolchain slice takes); either way it must not be treated as reviewed on the strength of this image-scoped statement, whose argument covers only the Debian package inside the pinned emulator image. Any future reader adding a `CVE-*` image record should assume the same widening applies to their id and check the filesystem and OSV surfaces before concluding a repo-tree finding is genuinely covered. Severity: GHSA and Red Hat agree at 7.5 HIGH and both gate scanners rate it HIGH — there is no vendor/tool divergence to disclose. Fix state: upstream reports every version through 5.0.7 as vulnerable and the pinned Debian package (2.0.1+~1.1.0-2) has no fixed version available at this digest, so nothing is remediated by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild."

