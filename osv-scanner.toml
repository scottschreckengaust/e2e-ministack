id = "CVE-2026-13697"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: undici's CACHE INTERCEPTOR mishandles a degenerate qualified `Cache-Control: private` directive (e.g. `private` set to an empty value), so a response can be stored in the default SHARED cache and later served to a different caller sharing the same cache key — disclosing private bodies/headers including Set-Cookie. A second defect in the same parser (an unqualified `private` combined with a qualified one) raises an uncaught TypeError that can terminate the process. Reaching either defect requires ALL of: (1) the consumer explicitly opting into the cache interceptor (it is OFF by default — undici only caches when a dispatcher is composed with `interceptors.cache()`), (2) that cache running in shared mode with a key shared across two or more DISTINCT callers, and (3) an upstream origin returning the malformed directive. None of the three holds here. `node-undici` is a Debian-packaged HTTP CLIENT library present in the base image; in this deployment MiniStack is the HTTP SERVER under test, and the only traffic is this repository's own `aws-cdk` CLI and AWS SDK v3 calls arriving on loopback port 4566. There is no multi-tenant shared undici response cache, and no adversary-controlled upstream origin whose response headers this repo's traffic would parse. Cross-caller disclosure is meaningless in a single-tenant, single-run container whose only caller is this repo's own test suite, and a process abort would at worst fail an ephemeral CI job. Severity, stated honestly: NVD scores this 9.1 CRITICAL and both gate scanners inherit that rating, while GHSA and Red Hat both score it 7.4 HIGH; this record is written against the higher NVD figure. Fix state: the pinned Debian `node-undici` 7.3.0 falls inside the affected range (undici 7.0.0 to before 7.29.0), and no fixed Debian package exists at the pinned digest, so no digest bump remediates it today. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild and drop this record once a rebuilt image ships undici >= 7.29.0."

