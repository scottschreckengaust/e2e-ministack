reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Accepted risk: the MiniStack emulator is a local-only CI dependency — it binds port 4566 on loopback, runs ephemerally inside the CI job (torn down each run), is never network-exposed, and is exercised solely by this repository's own CDK/SDK test traffic. CVE-2026-33630 is a use-after-free/double-free in c-ares' query-completion path reachable via ares_getaddrinfo() over TCP by an attacker who can return crafted DNS responses; MiniStack performs no adversary-controlled outbound DNS in this deployment, so no adversary can supply input that reaches the vulnerable code. It is a third-party image pinned by digest that this repo cannot patch. Fix state: no upstream fix is available for libcares2 at the pinned version (1.34.5-1+deb13u1; no fixed version in the Debian tracker at authoring time); nothing to remediate by bumping the digest. Surfaced by the Trivy DB after the original #84 batch on the same unchanged digest — a .vex/ staleness add (#76)."

