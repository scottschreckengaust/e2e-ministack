reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Accepted risk: the MiniStack emulator is a local-only CI dependency — it binds port 4566 on loopback, runs ephemerally inside the CI job (torn down each run), is never network-exposed, and is exercised solely by this repository's own CDK/SDK test traffic. CVE-2005-2541 is that tar restores setuid/setgid bits when extracting an archive with the explicit -p (--preserve-permissions) flag; Debian and Red Hat both classify this as intended archiving behaviour, not a defect (Debian tag: unimportant, 'This is intended behaviour ... you need to give -p as a command line flag'). No adversary can reach it here: this deployment never extracts attacker-supplied tar archives with -p — tar is present only as a base-image utility. Fix state: none — upstream treats it as designed behaviour, so there is no patched version to await; the record is retained as an honest acceptance for the pinned digest. It is a third-party image pinned by digest that this repo cannot patch and is not a production/deployed artifact. NVD scores this CVSSv2 10.0 while the distro treats it as non-security. Upstream advisory: https://nvd.nist.gov/vuln/detail/CVE-2005-2541."

