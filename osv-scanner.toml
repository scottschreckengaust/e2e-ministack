id = "CVE-2026-14643"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: a DISTINCT defect from CVE-2026-13697 in the same undici cache-control parser — this one mishandles optional WHITESPACE around the equals sign of a qualified `no-cache` or `private` directive, so the parser either drops the directive or stores a field name with literal quote characters. The qualification is then not recognised and the response is cached. Upstream states the precondition explicitly: it affects applications that ENABLE THE CACHE INTERCEPTOR IN SHARED MODE and forward Authorization headers, such that one user's authenticated response can be served from cache to a later, possibly unauthenticated caller resolving to the same cache key. That precondition is structurally absent here. The emulator never composes undici's opt-in cache interceptor in shared mode, and — decisively — this deployment has exactly ONE authenticated principal: every CDK and SDK call in this repository uses the same static dummy credential (`AWS_ACCESS_KEY_ID=test`) against a loopback-bound emulator. Even a perfect cache-key collision could therefore only ever serve the test suite its own data; there is no second user to disclose to, and no external caller can reach port 4566 to become one. The container is ephemeral and torn down each run, and `node-undici` is a base-image client library that this repo's traffic does not drive as an HTTP client at all. Severity, stated honestly: NVD scores this 7.5 HIGH (the rating both gate scanners apply), whereas GHSA and Red Hat both score it 5.9 MEDIUM; this record is written against the higher NVD figure. Fix state: the pinned Debian `node-undici` 7.3.0 is inside the affected range (7.0.0 to before 7.29.0) and no fixed Debian package exists at the pinned digest, so there is nothing to remediate by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild and drop this record once a rebuilt image ships undici >= 7.29.0."

