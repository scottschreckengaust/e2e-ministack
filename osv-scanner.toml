id = "CVE-2026-14456"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: when an OpenSSL QUIC SERVER (a Listener SSL object) processes valid QUIC Initial packets carrying unknown destination connection IDs, it allocates and queues a new incoming channel per packet without enforcing any limit (CWE-770). A remote peer that can deliver Initial packets faster than the application accepts connections drives unbounded per-channel state growth and can render the QUIC listener unavailable. Both preconditions are absent here, and this is the most clear-cut of the accepted image CVEs. First, the vulnerable allocation path is never CONSTRUCTED: MiniStack serves plain HTTP/1.1 over TCP on port 4566 and instantiates no OpenSSL QUIC listener at all, so the `SSL_new_listener` incoming-channel queue that holds the unbounded state is never created. QUIC is UDP-based and nothing in this repository's traffic — `cdk bootstrap`, `cdk deploy`, and AWS SDK v3 calls — speaks QUIC. OpenSSL here is a base-image TLS library, not a QUIC endpoint. Second, the advisory's `remote peer` cannot exist: the port is bound on loopback inside an ephemeral container that CI tears down each run, with no inbound network path from outside the host. Severity, stated honestly: Red Hat scores this 7.5 HIGH and both gate scanners rate it HIGH; no lower distro rating applies, so the acceptance is made at full HIGH. Fix state: upstream has DEFERRED the fix (Debian tracks it as `fix_deferred`) and there is no patched OpenSSL 3.5.x Debian package to move to at the pinned digest, so this is genuinely unfixable from this repository — it is a third-party image pinned by digest that this repo cannot patch. All three co-installed binary packages built from the same `openssl` source (libssl3t64, openssl, openssl-provider-legacy) are listed because the scanners report the finding against each. Revisit on the next image rebuild and drop this record once a rebuilt image carries the eventual OpenSSL fix."

