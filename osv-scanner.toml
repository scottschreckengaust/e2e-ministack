id = "CVE-2026-56846"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: a flaw in Node.js HTTP/2 handling lets RETAINED HEADER BLOCKS escape `maxSessionMemory` accounting, so a remote peer can drive memory exhaustion against an HTTP/2 server session. Reaching it requires an established HTTP/2 session with a peer that can push header blocks. This deployment establishes none. The emulator's control-plane listener speaks HTTP/1.1 on port 4566 — both the AWS SDK v3 clients and the `aws-cdk` CLI used by this repository negotiate HTTP/1.1 against that endpoint — so no HTTP/2 session is ever created and the `maxSessionMemory` accounting the flaw defeats is never exercised. The advisory's `remote` peer is equally unsatisfiable: the listener is bound on loopback inside an ephemeral container torn down at the end of each CI run, with no inbound path from outside the host, and the only client traffic is this repository's own deterministic test suite. Version applicability, stated honestly: the advisory names Node.js 24.x and 22.x as affected, while this image ships Node 20.19.2 — so applicability is doubtful and the gate scanners are matching on the Debian `nodejs` SOURCE PACKAGE name rather than a verified affected version range. This acceptance deliberately does NOT rest on that mismatch; the adversary-unreachability argument above is the primary and sufficient claim, and the version note is recorded only for completeness. Severity, stated honestly: Red Hat and Bitnami both score this 7.5 HIGH and both gate scanners rate it HIGH. Fix state: no fixed Debian `nodejs` package is available at the pinned digest (not-fixed), so nothing is remediated by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild."

[[IgnoredVulns]]
id = "CVE-2026-56848"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: a flaw in Node.js HTTP/2 handling allows `nghttp2_session_mem_send()` to be invoked RE-ENTRANTLY while `nghttp2_session_mem_recv()` is still executing, producing a heap-use-after-free and a denial of service. This is a distinct defect from CVE-2026-56846 (which concerns `maxSessionMemory` evasion), but it shares the same hard precondition: an ACTIVE nghttp2 session must exist for the send/recv callbacks to interleave at all. This deployment never creates one. MiniStack exposes an HTTP/1.1 endpoint on port 4566 and serves no HTTP/2 endpoint, so nghttp2's session state machine is never driven — the re-entrant call sequence that corrupts the heap cannot be initiated because there is no session object to drive. There is additionally no adversary positioned to attempt it: the listener binds loopback inside an ephemeral, per-run container with no inbound network path, and the only traffic is this repository's own `cdk` and AWS SDK v3 calls. Version applicability, stated honestly: the advisory names Node.js 26.x, 24.x and 22.x, while this image ships Node 20.19.2 — the gate scanners match on the Debian `nodejs` source-package name, not a verified affected range, so applicability is doubtful. This acceptance does NOT rest on that mismatch; the unreachability argument above stands on its own and the version note is recorded only for completeness. Severity, stated honestly: Red Hat and Bitnami both score this 7.5 HIGH and both gate scanners rate it HIGH. Fix state: no fixed Debian `nodejs` package is available at the pinned digest (not-fixed), so nothing is remediated by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild."

[[IgnoredVulns]]
id = "CVE-2026-58043"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: Node.js Permission Model enforcement can OVER-GRANT filesystem access across radix-tree prefix boundaries. Upstream states the precondition verbatim — `Under --permission, an attacker who is granted access to one path can abuse boundary handling to read from or write to paths outside the intended filesystem allowlist.` The vulnerable enforcement code therefore only runs when the Permission Model is switched on, and the vulnerability only has meaning when that allowlist is being relied upon as a security boundary against a partially-trusted actor. Neither condition holds here. MiniStack's Node processes are not launched with `--permission` (the Permission Model is strictly opt-in, and on the Node 20.x line this image ships it is still flagged experimental), so no allowlist boundary is constructed and there is nothing to escape from — the flawed radix-tree prefix check is never consulted. Nor is there a lesser-privileged actor inside the container to escalate: the emulator and the test traffic driving it form a single trust domain, the container filesystem is ephemeral and discarded at the end of each run, and the only inputs are this repository's own CDK templates and Lambda payloads arriving over loopback. An `attacker who is granted access to one path` has no analogue in this deployment. Version applicability, stated honestly: the advisory names Node.js main, 22.x, 24.x and 26.x, while this image ships Node 20.19.2 — the gate scanners match the Debian `nodejs` source-package name rather than a verified affected range, so applicability is doubtful. The acceptance does NOT rest on that mismatch; the absence of `--permission` is the primary, verifiable claim. Severity, stated honestly: Red Hat and Bitnami both score this 7.5 HIGH and both gate scanners rate it HIGH. Fix state: no fixed Debian `nodejs` package is available at the pinned digest (not-fixed), so nothing is remediated by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Revisit on the next image rebuild."

