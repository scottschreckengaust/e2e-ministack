id = "CVE-2026-69184"
reason = "VEX not_affected (vulnerable_code_cannot_be_controlled_by_adversary) — Vulnerable code: c-ares (GHSA-pjmc-gx33-gc76) follows DNS name COMPRESSION POINTER CHAINS without bounding their length, so parsing a crafted response burns CPU proportional to the chain and yields a denial of service. Reaching it requires the process to parse a MALICIOUS DNS RESPONSE, which means an adversary must control, or be able to spoof, a resolver that the container actually queries. No such position exists in this deployment. Name resolution inside the emulator is confined to `localhost`/loopback and to Docker's embedded DNS for the sibling containers MiniStack spawns for Lambda, RDS and ECS; in CI the upstream resolver is the GitHub-hosted runner's own, not an attacker-operated server. There is no path for a third party to inject a crafted response into that short-lived, host-local traffic, and no untrusted party can ask the emulator to resolve an arbitrary name in the first place — the only client is this repository's own test suite over loopback port 4566, and the container is destroyed at the end of the run. Scanner divergence, stated honestly and importantly: TRIVY rates this HIGH while GRYPE reports it with severity `Unknown` (Debian has assigned no rating), so it does not cross grype's high+ floor at all. Because this repository's image gate is the UNION of both scanners, the record is required for the Trivy leg; it is inert with respect to grype and must not be read as grype agreeing it is high. Fix state: grype reports the Debian fix state as `wont-fix` and no fixed `libcares2` package is available at the pinned digest, so nothing is remediated by bumping the digest. It is a third-party image pinned by digest that this repo cannot patch. Note on advisory metadata: the description text the Trivy database carries for this identifier is a mis-attributed Amazon Linux bundle blob covering several unrelated CVEs; the authoritative identity for this finding is GHSA-pjmc-gx33-gc76 against c-ares, which is what this record accepts. Revisit on the next image rebuild."

